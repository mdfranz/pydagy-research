[project]
name = "pydagy-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matt Franz", email = "mdfranz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-ai>=2.32.1",
    "pydantic-graph>=2.32.1",
]

[project.scripts]
pydagy-research = "pydagy_research:main"

[project.optional-dependencies]
antigravity = [
    "google-antigravity>=0.1.13",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
